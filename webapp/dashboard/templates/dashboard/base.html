{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}A股估值控制台{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'dashboard/app.css' %}">
  <script src="{% static 'dashboard/app.js' %}"></script>
</head>
<body>
  <nav class="topbar">
    <span class="brand">VALVE·WAVE 估值台</span>
    <a class="nav {% block navdata %}{% endblock %}" href="/data/">数据管理</a>
    <a class="nav {% block navscores %}{% endblock %}" href="/scores/">分数面板</a>
    <a class="nav {% block navreport %}{% endblock %}" href="/report/">报告浏览</a>
    <a class="nav {% block navgroups %}{% endblock %}" href="/groups/">分组管理</a>
    <span class="spacer"></span>
    <span class="job-dot"><span class="dot"></span>空闲</span>
  </nav>
  <form style="display:none">{% csrf_token %}</form>
  {% block content %}{% endblock %}
</body>
</html>
