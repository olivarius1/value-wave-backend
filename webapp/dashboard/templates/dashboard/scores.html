{% extends 'dashboard/base.html' %}
{% block title %}分数面板 · A股估值控制台{% endblock %}
{% block navscores %}active{% endblock %}
{% block content %}
<div class="wrap">
  <div class="flex" style="margin:4px 0 12px;flex-wrap:wrap;row-gap:8px">
    <h2 style="margin:0;white-space:nowrap">分数面板</h2>
    <span class="muted" id="scan-meta">加载中...</span>
    <span class="spacer" style="flex:1"></span>
    <div class="dropdown">
      <button id="group-dd-btn" title="按分组筛选">分组: 全部 ▾</button>
      <div class="dropdown-menu" id="group-dd-menu" style="display:none"></div>
    </div>
    <span class="muted" title="当前分在自身15年分数序列中的历史分位达到该值进入高分tab">高分≥</span>
    <input type="number" id="t-hi" min="0" max="100" value="90" style="width:62px"><span class="muted">%</span>
    <span class="muted" title="当前分在自身15年分数序列中的历史分位低于该值进入低分tab">低分≤</span>
    <input type="number" id="t-lo" min="0" max="100" value="20" style="width:62px"><span class="muted">%</span>
    <button class="primary" id="btn-scan" title="score_market 增量：只重算K线有新数据的股票">全市场评分</button>
  </div>

  <div id="scan-box" style="display:none" class="card">
    <div class="flex" style="margin-bottom:6px">
      <span id="scan-label" class="muted"></span>
      <div class="progressbar" style="flex:1"><div id="scan-bar" style="width:0%"></div></div>
      <span id="scan-progress" class="muted" style="font-family:var(--mono);font-size:12px"></span>
    </div>
    <div class="joblog" style="height:110px" id="scan-log"></div>
  </div>

  <div class="tabs mt">
    <div class="tab active" data-tab="hi">高分（低估候选 · 历史分位≥<span id="t-hi-label">90</span>%）<span id="cnt-hi" class="tag"></span></div>
    <div class="tab" data-tab="lo">低分（高估警惕 · 历史分位≤<span id="t-lo-label">20</span>%）<span id="cnt-lo" class="tag"></span></div>
  </div>

  <div class="tabpane active" id="pane-hi">
    <table class="grid" id="tbl-hi"><thead></thead><tbody></tbody></table>
  </div>
  <div class="tabpane" id="pane-lo">
    <table class="grid" id="tbl-lo"><thead></thead><tbody></tbody></table>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
// 高/低分判定 = 当前分在个股自身15年日度分数序列中的历史分位（score_pct，评分器产出）；
// 阈值页面可调（默认 ≥90% / ≤20%），存 localStorage
let T_HI = 90, T_LO = 20;
try {
  const saved = JSON.parse(localStorage.getItem('scoreThresh') || 'null');
  if (saved && saved.hi >= 0 && saved.lo >= 0) { T_HI = saved.hi; T_LO = saved.lo; }
} catch (e) {}

const COLS = [
  {key: 'score', label: '当前分', title: '评分器当前分（自身15年序列最新一天）', num: true},
  {key: 'score_pct', label: '历史分位', title: '当前分严格低于自身序列的比例', num: true,
   fmt: v => v == null ? '—' : v.toFixed(1) + '%'},
  {key: 'last_date', label: '数据至', title: '分数序列最后一天'},
  {key: 'code', label: '代码', num: true},
  {key: 'name', label: '名称'},
  {key: 'model_label', label: '模型'},
  {key: 'status', label: '状态'},
  {key: 'signal', label: '信号'},
  {key: 'price', label: '现价', num: true, fmt: v => api.fmtNum(v)},
  {key: 'pe', label: 'PE', num: true, fmt: v => api.fmtNum(v, 1)},
  {key: 'pe_range', label: 'PE区间'},
  {key: 'pb', label: 'PB', num: true, fmt: v => api.fmtNum(v)},
  {key: 'pb_range', label: 'PB区间'},
  {key: 'n_days', label: '序列天数', num: true},
];
let sortState = {hi: {key: 'score', dir: -1}, lo: {key: 'score', dir: 1}};
let ROWS = [];
let LATEST = '';   // 最新交易日
let GROUPS = [];   // [{id,name,count,codes}]，分组筛选
// 分组筛选记忆：null=未设置(默认「自选」内置组) / 'all'=明确选全部 / 其他=组id
let savedGroup = localStorage.getItem('scoreGroup');
let selectedGroupId = savedGroup && savedGroup !== 'all' ? savedGroup : '';
// 退市/长期停牌遗留股（序列落后最新交易日>60天，后端标记 delisted）系统级排除，
// 面板不显示；其余股票一律正常显示（含当日涨停/跌停，不做任何标注）
function groupPool() {
  if (!selectedGroupId) return ROWS;
  const g = GROUPS.find(x => String(x.id) === selectedGroupId);
  const codes = new Set(g ? g.codes : []);
  return ROWS.filter(r => codes.has(r.code));
}
function visibleRows() {
  return groupPool().filter(r => !r.delisted);
}

document.querySelectorAll('.tabs .tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tabs .tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tabpane').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('#pane-' + t.dataset.tab).classList.add('active');
}));

function scoreCell(r) {
  if (r.score == null) return '<span class="muted">—</span>';
  const cls = (r.score_pct != null && r.score_pct >= T_HI) ? 'score-hi'
            : ((r.score_pct != null && r.score_pct <= T_LO) ? 'score-lo' : '');
  return `<span class="${cls}">${r.score.toFixed(1)}</span>`;
}

function renderTable(pane) {
  const tbl = $('#tbl-' + pane);
  const s = sortState[pane];
  tbl.querySelector('thead').innerHTML = '<tr>' + COLS.map(c => `
    <th class="sortable ${c.num ? 'num' : ''}" data-key="${c.key}" title="${c.title || ''}">
      ${c.label}${s.key === c.key ? (s.dir === 1 ? ' ▲' : ' ▼') : ''}
    </th>`).join('') + '</tr>';
  const rows = visibleRows().filter(r => pane === 'hi'
    ? (r.score_pct != null && r.score_pct >= T_HI)
    : (r.score_pct != null && r.score_pct <= T_LO));
  rows.sort((a, b) => {
    const va = a[s.key], vb = b[s.key];
    if (va == null) return 1;
    if (vb == null) return -1;
    return (va > vb ? 1 : va < vb ? -1 : 0) * s.dir;
  });
  tbl.querySelector('tbody').innerHTML = rows.length ? rows.map(r => `
    <tr class="clickable" data-code="${r.code}" title="点击打开估值报告（新标签页）">
      ${COLS.map(c => {
        let v = r[c.key];
        if (c.key === 'score') return `<td class="num">${scoreCell(r)}</td>`;
        if (c.key === 'name') return `<td>${api.esc(v)}${r.in_watchlist ? ' <span class="tag wl">watchlist</span>' : ''}</td>`;
        return `<td class="${c.num ? 'num' : ''}">${c.fmt ? c.fmt(v) : api.esc(v || '—')}</td>`;
      }).join('')}
    </tr>`).join('')
    : `<tr><td colspan="${COLS.length}"><div class="empty-tip">无${pane === 'hi' ? '高分' : '低分'}股票（历史分位 ${pane === 'hi' ? '≥' + T_HI : '≤' + T_LO}%，可调整上方阈值）</div></td></tr>`;
  tbl.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
    const key = th.dataset.key;
    sortState[pane] = {key, dir: sortState[pane].key === key ? -sortState[pane].dir : (key === 'score' ? (pane === 'hi' ? -1 : 1) : 1)};
    renderTable(pane);
  }));
  tbl.querySelectorAll('tr.clickable').forEach(tr =>
    tr.addEventListener('click', () =>
      window.open('/report/?code=' + tr.dataset.code, '_blank')));
}

function applyThresholds() {
  T_HI = Math.min(100, Math.max(0, Number($('#t-hi').value) || 90));
  T_LO = Math.min(100, Math.max(0, Number($('#t-lo').value) || 20));
  localStorage.setItem('scoreThresh', JSON.stringify({hi: T_HI, lo: T_LO}));
  $('#t-hi-label').textContent = T_HI;
  $('#t-lo-label').textContent = T_LO;
  const pool = visibleRows();
  const hi = pool.filter(r => r.score_pct != null && r.score_pct >= T_HI).length;
  const lo = pool.filter(r => r.score_pct != null && r.score_pct <= T_LO).length;
  $('#cnt-hi').textContent = hi;
  $('#cnt-lo').textContent = lo;
  renderTable('hi');
  renderTable('lo');
}

async function loadGroups() {
  const data = await api.get('/api/groups/');
  GROUPS = data.groups;
  if (savedGroup === null) {
    // 未设置过：默认显示内置「自选」分组
    const builtin = GROUPS.find(g => g.is_builtin) || GROUPS[0];
    selectedGroupId = builtin ? String(builtin.id) : '';
  } else if (savedGroup === 'all') {
    selectedGroupId = '';
  } else if (!GROUPS.some(g => String(g.id) === savedGroup)) {
    selectedGroupId = '';   // 记着的分组已被删除 → 回全部
    savedGroup = 'all';
    localStorage.setItem('scoreGroup', 'all');
  }
  renderGroupMenu();
  applyThresholds();   // 默认分组解析后重算 tab 计数
}

function renderGroupMenu() {
  const cur = groupMenuLabel();
  $('#group-dd-btn').textContent = cur;
  const items = [{id: '', name: '全部'}].concat(GROUPS.map(g => ({...g})));
  $('#group-dd-menu').innerHTML = items.map(g => `
    <div class="dd-item ${String(g.id) === selectedGroupId ? 'active' : ''}" data-id="${g.id}">
      ${api.esc(g.name)}${g.count != null ? ` (${g.count})` : ''}
    </div>`).join('');
  document.querySelectorAll('#group-dd-menu .dd-item').forEach(el =>
    el.addEventListener('click', () => {
      selectedGroupId = el.dataset.id;
      savedGroup = selectedGroupId || 'all';
      localStorage.setItem('scoreGroup', savedGroup);
      $('#group-dd-menu').style.display = 'none';
      loadScores();
    }));
}

function groupMenuLabel() {
  if (!selectedGroupId) return '分组: 全部 ▾';
  const g = GROUPS.find(x => String(x.id) === selectedGroupId);
  return `分组: ${g ? g.name : '?'} ▾`;
}

$('#group-dd-btn').addEventListener('click', e => {
  e.stopPropagation();
  const menu = $('#group-dd-menu');
  menu.style.display = menu.style.display === 'none' ? '' : 'none';
});
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown')) $('#group-dd-menu').style.display = 'none';
});

async function loadScores() {
  const data = await api.get('/api/scores/');
  ROWS = data.rows.map(r => ({
    ...r,
    pe_range: (r.pe_min != null && r.pe_max != null) ? `${r.pe_min}~${r.pe_max}` : '',
    pb_range: (r.pb_min != null && r.pb_max != null) ? `${r.pb_min}~${r.pb_max}` : '',
  }));
  LATEST = data.latest_trading_day || '';
  const shown = groupPool().filter(r => !r.delisted).length;   // 面板可见只数（跟随分组）
  const groupName = selectedGroupId
    ? (GROUPS.find(g => String(g.id) === selectedGroupId) || {}).name || '' : '';
  $('#scan-meta').textContent =
    (groupName ? `分组「${groupName}」· ` : '') +
    `${shown} 只` +
    (LATEST ? ` · 最新交易日 ${LATEST}` : '') +
    (data.last_computed ? ` · 最近计算 ${data.last_computed}` : '');
  applyThresholds();
  renderGroupMenu();
}

// 评分任务进度（轮询任务列表中 kind=score_all / stock_update 的活动任务）
async function pollScan() {
  const data = await api.get('/api/jobs/');
  jobDot(data);
  const a = data.active;
  const scanning = a && (a.kind === 'score_all' || a.kind === 'stock_update');
  $('#scan-box').style.display = scanning ? '' : 'none';
  if (scanning) {
    $('#scan-label').textContent = `#${a.id} ${a.label}`;
    const pct = a.total ? Math.round(a.progress / a.total * 100) : 0;
    $('#scan-bar').style.width = pct + '%';
    $('#scan-progress').textContent = a.total ? `${a.progress}/${a.total}` : '';
    $('#scan-log').textContent = (a.tail || []).join('\n');
    $('#scan-log').scrollTop = $('#scan-log').scrollHeight;
  }
  return a;
}

$('#btn-scan').addEventListener('click', async () => {
  const r = await api.post('/api/jobs/create/', {kind: 'score_all'});
  if (r.status === 200 && !r.data.created) alert('评分任务已在队列/运行中');
  pollScan();
});

$('#t-hi').addEventListener('input', applyThresholds);
$('#t-lo').addEventListener('input', applyThresholds);

let hadJob = null;
setInterval(async () => {
  const a = await pollScan();
  const key = a ? a.id : null;
  if (hadJob && hadJob !== key) loadScores();   // 评分/单股更新结束 → 刷新
  hadJob = key;
}, 1500);
loadGroups().then(loadScores);   // 先解析分组（含默认「自选」）再统计
pollScan();
</script>
{% endblock %}
